# Fly.io configuration for pbr2rad.com
# Docs: https://fly.io/docs/reference/configuration/

app = "pbr2rad"          # fly app names are global — `fly launch` will prompt if taken
primary_region = "ord"   # change to the region nearest you (fly platform regions)

# OOM insurance: the conversion pipeline peaks at several hundred MB on 2k
# sets until the Phase B vectorization lands. Swap keeps a spike survivable.
swap_size_mb = 512

[build]
  # Uses the Dockerfile in this directory.

[env]
  # Warm the texture catalogs (ambientCG first — it's the landing source and
  # ~12 s cold) in a background thread at boot instead of on the first search.
  PBR2RAD_PREFETCH_CATALOGS = "1"
  # Ceiling for ~/.cache/pbr2rad (Poly Haven maps, ambientCG packs + map
  # thumbnails, catalogs). Least-recently-modified files are evicted past it.
  PBR2RAD_CACHE_MAX_MB = "1024"
  # Ceiling for live jobs (uploads + outputs, kept 30 min). New jobs get a
  # 503 past it instead of filling the disk.
  PBR2RAD_JOBS_MAX_MB = "3072"
  # Don't publish /docs, /redoc and /openapi.json.
  PBR2RAD_DISABLE_DOCS = "1"
  # Refuse requests that did not come through a Cloudflare edge (the
  # *.fly.dev name and the raw Fly IP both skip the WAF). The health check
  # is exempt. If the site ever answers 403 for everyone, Cloudflare added
  # an address range: update netsec.py or set PBR2RAD_CLOUDFLARE_CIDRS.
  PBR2RAD_REQUIRE_CLOUDFLARE = "1"
  # The stats page (/admin/stats) stays off until its token is set as a
  # secret:  fly secrets set PBR2RAD_ADMIN_TOKEN=<long random string>

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"   # scale to zero when idle — near-$0 at hobby traffic
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/api/v1/health"

[[vm]]
  # Dedicated CPU (2026-11-10, Jeff). A shared-cpu-1x runs at full speed only
  # while it has burst balance (5 s after each start, and scale-to-zero means
  # every wake is a start), then is held to a 6.25 % baseline: previews took
  # 75-82 s and missed the render budget. performance-1x is never throttled.
  # Billed per second while running; auto-stop above keeps idle cost ~$0
  # ($33/mo only if it ran around the clock).
  size = "performance-1x"
  memory = "2gb"   # performance-1x minimum; was 1gb (Pillow on 2048px maps + previews)
  # Keep the rootfs (and with it the download cache + catalogs) across
  # auto-stop/start AND deploys. Without this every idle->stop->start wipes
  # the cache, so catalogs are rebuilt upstream on every wake and every pack
  # is re-downloaded. Stopped-rootfs storage is billed per GB; the cache is
  # capped by PBR2RAD_CACHE_MAX_MB above.
  persist_rootfs = "always"
